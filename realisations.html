<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Réalisations - Candeliance EPA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">
        <a href="index.html">
            <img src="logo.png" alt="Candeliance EPA">
        </a>
    </div>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="realisations.html">Réalisations</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<!-- TITRE -->
<section class="hero">
    <h1>Nos réalisations</h1>
    <p>Éclairage public et aménagement urbain</p>
</section>

<!-- ✅ GALERIE -->
<section class="gallery">

    <div class="project">
        <img src="realisation1.jpg">
        <div class="overlay">
            <h3>Éclairage urbain</h3>
            <p>Valorisation d’un quartier résidentiel</p>
        </div>
    </div>

    <div class="project">
        <img src="realisation2.jpg">
        <div class="overlay">
            <h3>Aménagement résidentiel</h3>
            <p>Éclairage de voirie et espaces publics</p>
        </div>
    </div>

</section>

<!-- LIGHTBOX -->
<div id="lightbox">
    <span class="close">&times;</span>
    <img id="lightbox-img">
</div>

<footer>
    <p>© Candeliance‑EPA</p>
</footer>

<!-- JAVASCRIPT -->
<script>
const images = document.querySelectorAll(".project img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const close = document.querySelector(".close");

images.forEach(img => {
    img.addEventListener("click", () => {
        lightbox.style.display = "flex";
        lightboxImg.src = img.src;
    });
});

close.addEventListener("click", () => {
    lightbox.style.display = "none";
});
</script>

</body>
</html>
